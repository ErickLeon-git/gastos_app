name: Build Release AAB

# 1. Cuándo se ejecuta: en cada push a main
on:
  push:
    branches: [ main ]

# Permiso para poder crear el Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest   # máquina virtual de GitHub

    steps:
      # 2. Descargar tu código
      - name: Checkout
        uses: actions/checkout@v4

      # 3. Instalar Java (Gradle lo necesita para compilar Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Instalar Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'   # pon aquí TU versión
          channel: stable
          cache: true

      # 5. Descargar dependencias
      - name: Install dependencies
        run: flutter pub get

      # 6. (Opcional pero recomendado) Revisar el código y correr pruebas
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # 7. Reconstruir el keystore y key.properties desde los secretos
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # 8. Compilar el AAB firmado
      - name: Build AAB
        run: flutter build appbundle --release

      # 9. Leer la versión del pubspec.yaml (ej. 1.2.3+45)
      - name: Get version
        id: version
        run: echo "version=$(grep '^version:' pubspec.yaml | awk '{print $2}')" >> $GITHUB_OUTPUT

      # 10. Crear el GitHub Release y adjuntar el AAB
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: Release ${{ steps.version.outputs.version }}
          files: build/app/outputs/bundle/release/app-release.aab